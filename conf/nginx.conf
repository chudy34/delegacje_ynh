# Delegacje SaaS – YunoHost nginx config
# WAŻNE: blok /api/ musi być przed / żeby miał wyższy priorytet

location __PATH__/api/ {
    proxy_pass http://127.0.0.1:__PORT_BACKEND__/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120;
    client_max_body_size 60M;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT_FRONTEND__/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120;
    client_max_body_size 60M;
}
