# sources.toml – zarezerwowane na przyszłe instalacje oparte o release
# Obecnie skrypt install używa bezpośrednio git clone.
# Po otagowaniu v1.0 na GitHubie zaktualizuj URL i sha256, i przejdź na ynh_setup_source.

[main]
url = "https://github.com/chudy34/Delegacje/archive/refs/heads/main.tar.gz"
sha256 = "FILL_IN_AFTER_TAGGING_RELEASE"
format = "tar.gz"
extract = true
autoupdate.strategy = "latest_github_tag"
