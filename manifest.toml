packaging_format = 2

id = "delegacje"
name = "Delegacje SaaS"
description.en = "Professional business trip expense management system for contractors"
description.pl = "Profesjonalny system zarzadzania delegacjami dla kontraktow"

version = "1.0~ynh1"

maintainers = ["chudy34"]

[upstream]
license = "MIT"
code = "https://github.com/chudy34/Delegacje"
admindoc = "https://github.com/chudy34/Delegacje"

[integration]
yunohost = ">= 11.2"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = false
sso = false
disk = "1G"
ram.build = "1024M"
ram.runtime = "512M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.admin_email]
    ask.en = "Admin email address"
    ask.pl = "Adres email administratora"
    type = "email"

    [install.admin_password]
    ask.en = "Admin password (min 8 chars, uppercase + number required)"
    ask.pl = "Haslo administratora (min 8 znakow, wielka litera + cyfra)"
    type = "password"

    [install.ai_provider]
    ask.en = "AI Provider for receipt OCR"
    ask.pl = "Dostawca AI do OCR paragonow"
    type = "select"
    choices = ["none", "gemini", "openai"]
    default = "none"

    [install.gemini_api_key]
    ask.en = "Gemini API Key (leave empty if not using Gemini)"
    ask.pl = "Klucz API Gemini (zostaw pusty jesli nie uzywasz Gemini)"
    type = "string"
    optional = true
    default = ""

    [install.openai_api_key]
    ask.en = "OpenAI API Key (leave empty if not using OpenAI)"
    ask.pl = "Klucz API OpenAI (zostaw pusty jesli nie uzywasz OpenAI)"
    type = "string"
    optional = true
    default = ""

[resources]
    [resources.system_user]

    [resources.install_dir]
    dir = "/var/www/__APP__"
    owner = "__APP__:rwx"
    group = "__APP__:rx"

    [resources.data_dir]
    dir = "/home/yunohost.app/__APP__"
    owner = "__APP__:rwx"
    group = "__APP__:rx"
    subdirs = ["uploads", "logs"]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.ports]
    backend.default = 3001
    frontend.default = 3000

    [resources.apt]
    packages = [
        "postgresql",
        "postgresql-client",
        "tesseract-ocr",
        "tesseract-ocr-pol",
        "tesseract-ocr-eng",
        "tesseract-ocr-deu"
    ]
    extras.nodejs.repo = "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main"
    extras.nodejs.key = "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    extras.nodejs.packages = "nodejs"

    [resources.database]
    type = "postgresql"
